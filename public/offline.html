<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <title>You are offline — Mirror Media Cloud</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #020617;
        --bg-card: rgba(15, 23, 42, 0.65);
        --border: rgba(148, 163, 184, 0.18);
        --text-main: #e2e8f0;
        --text-muted: #94a3b8;
        --brand-blue: #0ea5e9;
        --brand-emerald: #10b981;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text-main);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background-image:
          radial-gradient(circle at 20% 10%, rgba(14, 165, 233, 0.12), transparent 60%),
          radial-gradient(circle at 80% 90%, rgba(16, 185, 129, 0.12), transparent 55%);
      }
      .card {
        max-width: 480px;
        width: 100%;
        text-align: center;
        padding: 36px 28px;
        border-radius: 24px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45);
      }
      .logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 22px;
        letter-spacing: 1px;
        color: #fff;
        background: linear-gradient(135deg, var(--brand-blue), var(--brand-emerald));
        box-shadow: 0 18px 40px rgba(14, 165, 233, 0.35);
      }
      h1 {
        font-size: 24px;
        margin: 0 0 10px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 28px;
        color: var(--text-muted);
        line-height: 1.55;
        font-size: 15px;
      }
      button {
        appearance: none;
        border: 0;
        cursor: pointer;
        padding: 12px 28px;
        font-size: 15px;
        font-weight: 600;
        color: #fff;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--brand-blue), var(--brand-emerald));
        box-shadow: 0 12px 26px rgba(16, 185, 129, 0.3);
        transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
      }
      button:hover { transform: translateY(-1px); filter: brightness(1.05); }
      button:active { transform: translateY(0); }
      .status {
        margin-top: 22px;
        font-size: 12px;
        color: var(--text-muted);
      }
      .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #ef4444;
        margin-right: 6px;
        vertical-align: middle;
        box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.15);
      }
    </style>
  </head>
  <body>
    <main class="card" role="alert">
      <div class="logo" aria-hidden="true">MMC</div>
      <h1>You are offline</h1>
      <p>
        Mirror Media Cloud needs internet to sync uploads, schedules, and
        platform data. Reconnect to continue working.
      </p>
      <button type="button" onclick="window.location.reload()">Retry</button>
      <div class="status"><span class="dot"></span>No network connection</div>
    </main>
    <script>
      // Auto-retry the moment the browser regains connectivity.
      window.addEventListener('online', () => window.location.reload());
    </script>
  </body>
</html>
