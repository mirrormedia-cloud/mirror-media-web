<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mirror Media Cloud</title>
    <meta name="description" content="OTT library, social upload, scheduling and analytics automation platform." />

    <!-- PWA manifest + theming -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mirror Media Cloud" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Icons. /favicon.png is the brand favicon. The square 192/512
         icons under /icons remain as fallbacks for browsers that prefer
         a sized alternate, and for the iOS home-screen tile. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="alternate icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="alternate icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
